name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # postinstall (electron-rebuild) needs Electron's headers; for tests
        # we only need the Node ABI of better-sqlite3, so skip postinstall.
        run: npm ci --ignore-scripts

      - name: Fetch Node-ABI prebuilt for better-sqlite3
        run: npx prebuild-install -r node --prefix node_modules/better-sqlite3

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
